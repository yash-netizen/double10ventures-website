<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Request a Quote — Double 10 Ventures (Mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<link rel="stylesheet" href="assets/site.css?v=6">
<style>
.qhead{padding:46px 0 10px}
.qhead h1{font-size:clamp(2rem,4vw,3rem);margin:8px 0 8px}
.qsteps{display:flex;gap:10px;align-items:center;margin:20px 0 34px;font-size:.85rem;color:var(--brown-2);flex-wrap:wrap}
.qsteps span{display:flex;align-items:center;gap:8px}
.qsteps i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:.8rem;background:var(--cream-2);border:1px solid var(--sand)}
.qsteps .on i{background:var(--gold);color:#fff;border-color:var(--gold)}
.qsteps em{width:30px;height:1px;background:var(--sand)}
.qgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:start}
.lines .line{display:grid;grid-template-columns:84px 1fr auto auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--sand);animation:slidein .4s var(--ease) both}
.lines img{width:84px;height:84px;border-radius:12px;object-fit:cover}
.lines b{display:block}
.lines small{color:var(--brown-2);font-size:.8rem;letter-spacing:.04em}
.rm{background:none;border:none;color:var(--brown-2);cursor:pointer;font-size:1.3rem;transition:.25s}
.rm:hover{color:#b3261e;transform:rotate(90deg)}
.sum{display:flex;justify-content:space-between;padding:16px 0;font-weight:600}
.panel h2{font-size:1.6rem;margin-bottom:18px}
.sticky{position:sticky;top:96px}
.emptyq{text-align:center;padding:70px 20px}
.emptyq h2{font-size:1.8rem;margin-bottom:10px}
@media(max-width:960px){ .qgrid{grid-template-columns:1fr} .sticky{position:static} }
@media(max-width:560px){ .lines .line{grid-template-columns:64px 1fr;} .lines img{width:64px;height:64px} .lines .qty,.rm{grid-column:2;justify-self:start} }
</style>
</head>
<body data-page="products">

<div class="wrap" id="app">
  <div class="qhead">
    <div class="eyebrow">Request a quote</div>
    <h1>Review your quote cart</h1>
    <div class="qsteps"><span class="on"><i>1</i>Quote cart</span><em></em><span class="on"><i>2</i>Your details</span><em></em><span id="s3"><i>3</i>Confirmation</span></div>
  </div>
  <div class="qgrid" id="qgrid">
    <div>
      <div class="lines" id="lines"></div>
      <div class="sum"><span>Total items</span><span id="tot">0</span></div>
      <a class="link-arrow" href="products.html">Continue browsing products</a>
    </div>
    <div class="sticky">
      <form class="panel" id="qform">
        <h2>Your details</h2>
        <div class="field"><label>Full name *</label><input required></div>
        <div class="field"><label>Restaurant / business name *</label><input required></div>
        <div class="row2"><div class="field"><label>Email *</label><input type="email" required></div><div class="field"><label>Phone / WhatsApp *</label><input type="tel" required></div></div>
        <div class="row2"><div class="field"><label>City</label><input></div><div class="field"><label>Country</label><input value="India"></div></div>
        <div class="field"><label>Notes</label><textarea placeholder="Quantities, delivery timeline, customisation or branding needs…"></textarea></div>
        <label class="check"><input type="checkbox">I need customisation or branding options</label>
        <label class="check"><input type="checkbox">This is an international sourcing / export enquiry</label>
        <button class="btn btn-gold" style="width:100%" type="submit">Submit Quote Request →</button>
        <p class="muted" style="font-size:.8rem;margin-top:12px;text-align:center">No payment needed. You'll get a confirmation email with every product ID.</p>
      </form>
    </div>
  </div>
</div>

<script src="assets/site.js?v=6"></script>
<script>
(function(){
  var U = D10.img, cart = D10.cart;
  document.body.classList.add('ready');
  var sent = false;
  function draw(){
    if(sent) return;
    var keys = Object.keys(cart);
    if(!keys.length){
      document.getElementById('qgrid').innerHTML = '<div class="emptyq" style="grid-column:1/-1"><h2>Your quote cart is empty</h2><p class="muted" style="margin-bottom:24px">Add products from the catalogue to request a quote.</p><a class="btn btn-gold" href="products.html">Browse Products →</a></div>';
      return;
    }
    document.getElementById('lines').innerHTML = keys.map(function(k, i){
      var p = D10.bySku(k);
      return '<div class="line" style="animation-delay:' + (i * .06) + 's"><img src="' + U(p.img, 240) + '" alt=""><div><b>' + p.name + '</b><small>' + p.sku + (p.mat ? ' · ' + p.mat : '') + '</small></div>' +
        '<div class="qty"><button data-k="' + k + '" data-q="-1">−</button><span>' + cart[k] + '</span><button data-k="' + k + '" data-q="1">+</button></div>' +
        '<button class="rm" data-rm="' + k + '" aria-label="Remove">×</button></div>';
    }).join('');
    document.getElementById('tot').textContent = D10.cartCount();
  }
  document.getElementById('lines').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.dataset.rm) D10.setQty(b.dataset.rm, 0);
    else D10.setQty(b.dataset.k, (cart[b.dataset.k] || 0) + (+b.dataset.q));
  });
  document.addEventListener('cartchange', draw);
  draw();

  // the form is replaced by an 'empty cart' message when there is nothing to quote
  var qf = document.getElementById('qform');
  if(qf) qf.addEventListener('submit', function(e){
    e.preventDefault();
    sent = true;
    var ref = 'Q-2026-' + String(Math.floor(1000 + Math.random() * 9000));
    var items = Object.keys(cart).map(function(k){ return '<li>' + k + ' · ' + D10.bySku(k).name + ' × ' + cart[k] + '</li>'; }).join('');
    document.getElementById('s3').classList.add('on');
    document.getElementById('qgrid').innerHTML = '<div class="panel" style="grid-column:1/-1"><div class="success"><div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div>' +
      '<h2>Quote request received</h2><p class="muted">Thank you. Our team will get back to you with details for your requirement.</p><div class="ref">Reference ' + ref + '</div>' +
      '<ul style="list-style:none;color:var(--brown-2);font-size:.92rem;margin-bottom:24px">' + items + '</ul>' +
      '<p class="muted" style="font-size:.85rem;margin-bottom:22px">In the real site, a confirmation email goes to you and an alert with these product IDs goes to the Double 10 team. (Mockup only: nothing was sent.)</p>' +
      '<a class="btn btn-gold" href="index.html">Back to Home</a></div></div>';
    D10.clearCart();
    scrollTo({top:0, behavior:'smooth'});
  });
})();
</script>
</body>
</html>
